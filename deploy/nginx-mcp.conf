# NGINX snippet for app.dragapp.com/mcp → MCP service.
# Drop the `location` blocks into the existing app.dragapp.com server {} block,
# and the `upstream` near your other upstreams. Standard proxy_pass, with ONE
# critical difference: Streamable HTTP responses can be SSE streams, so
# proxy_buffering MUST be off or streamed responses stall behind NGINX.

upstream mcp_backend {
    # The MCP EC2 instance in the VPC (private address + MCP_PORT).
    server 10.0.0.0:3001;
    keepalive 32;
}

# Query-string-stripped access log for MCP traffic. Goes in the http {} block
# (log_format is not allowed inside server {}). Credentials never ride in MCP
# URLs by design, but $uri (instead of $request) guarantees that nothing after
# a "?" is ever written to disk regardless of what a client sends.
log_format mcp_noquery '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent "$http_user_agent"';

server {
    # ... existing app.dragapp.com server block (listen 443 ssl, TLS, etc.) ...

    location /mcp {
        # Trailing slash decides prefix handling; the service accepts BOTH so
        # either is fine:
        #   proxy_pass http://mcp_backend;    → upstream receives  /mcp   (prefix kept)
        #   proxy_pass http://mcp_backend/;   → upstream receives  /      (prefix stripped)
        proxy_pass http://mcp_backend;

        # Never log query strings for MCP requests (see log_format above).
        access_log /var/log/nginx/mcp.access.log mcp_noquery;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The user's DragApp token rides in Authorization; pass it through.
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header Connection        "";

        # ── SSE / streaming — required ──
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # ── OAuth discovery — REQUIRED for "paste a URL" connectors ──
    # Claude/ChatGPT/Gemini discover the OAuth endpoints via RFC well-known
    # documents at the DOMAIN ROOT (e.g. /.well-known/oauth-authorization-server/mcp),
    # which the /mcp location above does not match. Route them to the MCP
    # service too. The ^~ prefix keeps other well-knowns (if any) untouched.
    location ^~ /.well-known/oauth-protected-resource {
        proxy_pass http://mcp_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /.well-known/oauth-authorization-server {
        proxy_pass http://mcp_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /.well-known/openid-configuration {
        proxy_pass http://mcp_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # MCP server card (static descriptor read by Smithery and other
    # directory crawlers) — also expected at the domain root.
    location = /.well-known/mcp/server-card.json {
        proxy_pass http://mcp_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: expose the health check for external load-balancer probes.
    location = /mcp/health {
        proxy_pass http://mcp_backend/health;
        proxy_buffering off;
        access_log off;
    }
}
